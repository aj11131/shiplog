# Build the images, push them to ACR, and deploy to AKS with Helm.
#
# Triggers: app/chart changes merged to main, a successful Terraform Apply, or manually.
# Runs as the apply identity in the "dev" environment (approval required).
name: Deploy to AKS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "charts/**"
      - "deploy/otel-collector/**"
      - "deploy/cert-manager/**"
      - ".github/workflows/deploy-aks.yml"
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aks-dev
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  HELM_VERSION: v4.3.0
  OTEL_CHART_VERSION: 0.175.1
  CERT_MANAGER_VERSION: v1.21.2
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tfstate_resource_group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TF_VAR_tfstate_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Decide whether this run should deploy. It has no `environment`, so it never asks for approval.
  gate:
    name: should deploy?
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          if [ "$EVENT" = "workflow_run" ] && [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Terraform Apply did not succeed; not deploying."; deploy=false
          elif [ "$EVENT" = "push" ] && git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null | grep -qE '^(infra/|\.github/workflows/terraform-)'; then
            # The same push also changed infrastructure. Terraform Apply runs for it, and this
            # workflow runs again once that apply succeeds. Deploying now would race the apply.
            echo "Push also changed infra/: the deploy will run after Terraform Apply instead."; deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "### Deploy: $deploy" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy · aks-dev
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      # ---- 1. Read infrastructure details from Terraform state -----------------
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Read Terraform outputs
        id: tf
        working-directory: infra/azure/aks
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=aks-dev.tfstate" \
            -backend-config="use_azuread_auth=true" >/dev/null
          terraform output -json > "$RUNNER_TEMP/tf.json"
          out() { jq -r ".$1.value" "$RUNNER_TEMP/tf.json"; }
          if [ "$(out cluster_name)" = "null" ]; then
            echo "::error::No AKS cluster in Terraform state. Run the Terraform Apply workflow first."; exit 1
          fi
          # Mask the App Insights connection string so it never appears in logs.
          echo "::add-mask::$(out app_insights_connection_string)"

          # Entra ID app registrations (step 4).
          terraform -chdir=../identity init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=identity-dev.tfstate" \
            -backend-config="use_azuread_auth=true" >/dev/null
          terraform -chdir=../identity output -json > "$RUNNER_TEMP/identity.json"
          host=$(jq -r ".app_hostname.value" "$RUNNER_TEMP/identity.json")
          if [ "$host" = "null" ]; then
            echo "::error::No identity outputs. Run the Terraform Apply workflow first."; exit 1
          fi
          {
            echo "cluster=$(out cluster_name)"
            echo "rg=$(out resource_group_name)"
            echo "location=$(out location)"
            echo "acr=$(out acr_name)"
            echo "registry=$(out acr_login_server)"
            echo "host=$host"
            echo "dns_label=${host%%.*}"
          } >> "$GITHUB_OUTPUT"

      # ---- 2. Build & push images ---------------------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ steps.tf.outputs.acr }}"

      - uses: docker/setup-buildx-action@v4

      - name: Build & push shiplog-api
        uses: docker/build-push-action@v7
        with:
          context: src/api
          push: true
          build-args: VERSION=0.1.0+${{ env.IMAGE_TAG }}
          tags: ${{ steps.tf.outputs.registry }}/shiplog-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push shiplog-web
        uses: docker/build-push-action@v7
        with:
          context: src/web
          push: true
          tags: ${{ steps.tf.outputs.registry }}/shiplog-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ---- 3. Connect to the cluster ------------------------------------------
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.20

      - name: Get kubeconfig (Entra ID)
        run: |
          az aks get-credentials --resource-group "${{ steps.tf.outputs.rg }}" --name "${{ steps.tf.outputs.cluster }}" --overwrite-existing
          # Local accounts are disabled, so kubectl must get an Entra token. Reuse the az CLI's OIDC sign-in.
          kubelogin convert-kubeconfig -l azurecli
          kubectl get nodes -o wide

      # ---- 4. OpenTelemetry Collector -----------------------------------------
      - name: Deploy OpenTelemetry Collector
        run: |
          out() { jq -r ".$1.value" "$RUNNER_TEMP/tf.json"; }
          # The collector reads node log files (hostPath), which only the "privileged" Pod Security level permits.
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace observability --overwrite pod-security.kubernetes.io/enforce=privileged

          # Per-cluster values as a JSON file (JSON is valid YAML), so long URLs need no --set escaping.
          jq -n \
            --arg client "$(out otel_collector_client_id)" \
            --arg cluster "$(out cluster_name)" \
            --argjson ep "$(jq '.otlp_endpoints.value' "$RUNNER_TEMP/tf.json")" \
            '{
              serviceAccount: { annotations: { "azure.workload.identity/client-id": $client } },
              config: { exporters: { "otlphttp/azuremonitor": {
                traces_endpoint: $ep.traces, logs_endpoint: $ep.logs, metrics_endpoint: $ep.metrics } } },
              extraEnvs: [ { name: "CLUSTER_NAME", value: $cluster }, { name: "CLOUD_PROVIDER", value: "azure" } ]
            }' > "$RUNNER_TEMP/otel-values.json"

          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
          helm upgrade --install otel-collector open-telemetry/opentelemetry-collector \
            --version "$OTEL_CHART_VERSION" --namespace observability \
            -f deploy/otel-collector/values-azure.yaml -f "$RUNNER_TEMP/otel-values.json" \
            --wait --timeout 5m

      # ---- 5. cert-manager ----------------------------------------------------
      - name: Deploy cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --version "$CERT_MANAGER_VERSION" --namespace cert-manager --create-namespace \
            -f deploy/cert-manager/values.yaml --wait --timeout 5m

      # ---- 6. Shiplog ---------------------------------------------------------
      # Deployed BEFORE the Gateway: switching the web Service from LoadBalancer to ClusterIP
      # releases the public IP holding the DNS label, which the Gateway then claims.
      - name: Deploy Shiplog
        env:
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          out() { jq -r ".$1.value" "$RUNNER_TEMP/tf.json"; }
          id() { jq -r ".$1.value" "$RUNNER_TEMP/identity.json"; }
          kubectl create namespace shiplog --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace shiplog --overwrite \
            pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted

          jq -n \
            --arg registry "$(out acr_login_server)" \
            --arg tag "$IMAGE_TAG" \
            --arg cluster "$(out cluster_name)" \
            --arg region "$(out location)" \
            --arg ai "$(out app_insights_connection_string)" \
            --arg host "$HOST" \
            --arg tenant "$(id tenant_id)" \
            --arg api "$(id api_client_id)" \
            --arg web "$(id web_client_id)" \
            --arg scope "$(id api_scope)" \
            '{
              image: { registry: $registry, tag: $tag },
              environment: { cluster: $cluster, region: $region },
              web: { appInsightsConnectionString: $ai },
              gateway: { hostname: $host },
              auth: { tenantId: $tenant, apiClientId: $api, webClientId: $web, apiScope: $scope }
            }' > "$RUNNER_TEMP/shiplog-values.json"

          helm upgrade --install shiplog charts/shiplog --namespace shiplog \
            -f charts/shiplog/values-aks.yaml -f "$RUNNER_TEMP/shiplog-values.json" \
            --wait --timeout 10m

      - name: helm test
        run: helm test shiplog --namespace shiplog --logs

      # ---- 7. HTTPS Gateway ---------------------------------------------------
      - name: Deploy Gateway + certificate
        env:
          HOST: ${{ steps.tf.outputs.host }}
          DNS_LABEL: ${{ steps.tf.outputs.dns_label }}
        run: |
          # Baseline (not restricted): the Gateway's Envoy proxy pods are generated by AKS's Istio.
          kubectl create namespace ingress --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ingress --overwrite pod-security.kubernetes.io/enforce=baseline

          helm upgrade --install shiplog-gateway charts/gateway --namespace ingress \
            --set hostname="$HOST" --set azureDnsLabel="$DNS_LABEL"

          kubectl wait --for=condition=Programmed gateway/shiplog -n ingress --timeout=5m
          # Let's Encrypt validates over HTTP-01, a minute or two after the IP gets its DNS name.
          kubectl wait --for=condition=Ready certificate/shiplog-tls -n ingress --timeout=10m

      - name: Smoke test over HTTPS
        env:
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          url="https://$HOST"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$url/healthz" >/dev/null; then break; fi
            echo "waiting for $url ($i)"; sleep 10
          done
          curl -fsS "$url/healthz"; echo
          curl -fsS "$url/api/diagnostics"; echo
          echo "--- anonymous write must be rejected with 401"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url/api/entries" -H "Content-Type: application/json" -d '{"message":"hi"}')
          [ "$code" = "401" ] || { echo "::error::expected 401, got $code"; exit 1; }
          echo "--- plain HTTP redirects to HTTPS"
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "http://$HOST/"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get gateway,httproute,certificate,certificaterequest,order,challenge -A || true
          kubectl describe gateway shiplog -n ingress | tail -30 || true
          kubectl describe challenge -n ingress | tail -30 || true
          kubectl get svc -A | grep -i loadbalancer || true

      - name: Summary
        if: always()
        env:
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          ip=$(kubectl get gateway shiplog -n ingress -o jsonpath='{.status.addresses[0].value}' 2>/dev/null)
          fence='```'
          {
            echo "### Deploy to AKS · dev"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| App | https://$HOST |"
            echo "| Gateway IP | ${ip:-pending} |"
            echo "| Image tag | ${IMAGE_TAG} |"
            echo
            echo "$fence"
            kubectl get gateway,httproute,certificate -A 2>/dev/null
            echo
            kubectl get pods -n shiplog -o wide 2>/dev/null
            echo "$fence"
          } >> "$GITHUB_STEP_SUMMARY"
