# Continuous integration for the application code.
# Runs on every PR (and push to main) that touches the API or web client:
# build, lint and unit tests, plus a Docker build to prove the images still build.
# Image publishing and deployment arrive with the Terraform/Helm CI/CD in a later step.
name: App CI

on:
  pull_request:
    paths:
      - "src/**"
      - "compose*.yaml"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "compose*.yaml"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# A new push to the same PR cancels the run that is already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Shiplog.slnx

      - name: Build
        run: dotnet build Shiplog.slnx --no-restore -c Release -warnaserror

      - name: Test
        run: >
          dotnet test Shiplog.slnx --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory ${{ runner.temp }}/api-test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: ${{ runner.temp }}/api-test-results

  web:
    name: Web · lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: src/web/coverage

  images:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build shiplog-${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: src/${{ matrix.image }}
          push: false
          tags: shiplog-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
