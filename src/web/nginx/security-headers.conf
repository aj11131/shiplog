# Included in every location: nginx drops server-level add_header directives
# in any location that declares its own add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $hsts always; # empty (not sent) over plain HTTP; see default.conf.template

# Content-Security-Policy: the browser refuses anything not listed here, which blunts XSS.
#   script-src   only our own bundles (no inline scripts, no CDNs)
#   style-src    Angular injects component styles as <style> tags, hence 'unsafe-inline'
#   connect-src  our API, Entra (token endpoint), Application Insights ingestion + config
#   frame-src    Entra, for MSAL's hidden-iframe token renewal
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com https://*.in.applicationinsights.azure.com https://*.livediagnostics.monitor.azure.com https://js.monitor.azure.com; frame-src https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
