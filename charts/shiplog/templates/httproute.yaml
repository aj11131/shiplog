{{- if .Values.gateway.enabled }}
# Attaches the web app to the shared Gateway's HTTPS listener (charts/gateway). Allowed
# because the Gateway's listener admits routes from this namespace (allowedRoutes).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "shiplog.componentName" (dict "root" $ "component" "web") }}
  labels:
    {{- include "shiplog.labels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ required "gateway.hostname is required when gateway.enabled" .Values.gateway.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "shiplog.componentName" (dict "root" $ "component" "web") }}
          port: {{ .Values.web.service.port }}
{{- end }}
