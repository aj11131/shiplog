{{- $c := dict "root" $ "component" "api" -}}
{{- $name := include "shiplog.componentName" $c -}}
{{- $otlp := include "shiplog.otlpEndpoint" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API doesn't call the Kubernetes API, so don't mount a token by default.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shiplog.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  # With autoscaling on, the HPA owns the replica count, so it is left out here.
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired count during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "shiplog.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shiplog.labels" $c | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- include "shiplog.podSecurityContext" . | nindent 8 }}
      {{- if .Values.api.migrations.enabled }}
      initContainers:
        # Same image, run with --migrate-only: applies EF Core migrations, then exits.
        # Every new pod runs it. EF Core takes a database lock while migrating, so
        # replicas starting together don't collide, and if the database isn't up yet the
        # init container fails and Kubernetes retries it with back-off.
        - name: migrate
          image: {{ include "shiplog.image" (dict "root" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate-only"]
          env:
            {{- include "shiplog.api.env" . | nindent 12 }}
          securityContext:
            {{- include "shiplog.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: api
          image: {{ include "shiplog.image" (dict "root" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "shiplog.api.env" . | nindent 12 }}
            {{- with $otlp }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # startup: allow up to 60s to boot; liveness only begins after it passes.
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # liveness: restart the container if the process hangs (no dependency checks).
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readiness: remove from the Service while the database is unreachable.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            {{- include "shiplog.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Prefer spreading replicas across nodes, so losing one node doesn't take out every replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "shiplog.selectorLabels" $c | nindent 14 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization # percent of the container's CPU *request*
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "shiplog.selectorLabels" $c | nindent 6 }}
{{- end }}

{{- define "shiplog.api.env" -}}
- name: ASPNETCORE_ENVIRONMENT
  value: Production
- name: Database__Provider
  value: Postgres
- name: DB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ include "shiplog.db.secretName" . | quote }}
      key: {{ include "shiplog.db.passwordKey" . | quote }}
- name: ConnectionStrings__Shiplog
  value: {{ include "shiplog.db.connectionString" . | quote }}
- name: Runtime__Cloud
  value: {{ .Values.environment.cloud | quote }}
- name: Runtime__Region
  value: {{ .Values.environment.region | quote }}
- name: Runtime__Cluster
  value: {{ .Values.environment.cluster | quote }}
# Downward API: Kubernetes fills these in with the pod's own node and name.
- name: Runtime__Node
  valueFrom:
    fieldRef:
      fieldPath: spec.nodeName
- name: Runtime__Pod
  valueFrom:
    fieldRef:
      fieldPath: metadata.name
{{- end -}}
