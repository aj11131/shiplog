{{- $c := dict "root" $ "component" "web" -}}
{{- $name := include "shiplog.componentName" $c -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  {{- if and (eq .Values.web.service.type "LoadBalancer") .Values.web.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.web.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "shiplog.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "shiplog.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shiplog.labels" $c | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- include "shiplog.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "shiplog.image" (dict "root" $ "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          # Rendered into nginx.conf and /config.json at startup (see src/web/nginx).
          env:
            - name: API_UPSTREAM
              value: "http://{{ include "shiplog.componentName" (dict "root" $ "component" "api") }}:8080"
            - name: API_BASE_URL
              value: ""
            - name: SHIPLOG_ENVIRONMENT
              value: {{ .Values.environment.name | quote }}
            - name: APPINSIGHTS_CONNECTION_STRING
              value: {{ .Values.web.appInsightsConnectionString | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            {{- include "shiplog.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # Writable paths for nginx under a read-only root filesystem:
          # /etc/nginx/conf.d receives the rendered template, /tmp holds the pid file and temp buffers.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "shiplog.selectorLabels" $c | nindent 14 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "shiplog.labels" $c | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "shiplog.selectorLabels" $c | nindent 6 }}
{{- end }}
