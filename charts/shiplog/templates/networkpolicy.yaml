{{- if .Values.networkPolicy.enabled }}
{{- $api := dict "root" $ "component" "api" -}}
{{- $web := dict "root" $ "component" "web" -}}
# 1. Default deny: no pod in this release accepts traffic unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shiplog.fullname" . }}-default-deny
  labels:
    {{- include "shiplog.labels" (dict "root" $ "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
---
# 2. web: the public entry point. Anyone may reach it on its HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shiplog.componentName" $web }}
  labels:
    {{- include "shiplog.labels" $web | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shiplog.selectorLabels" $web | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
---
# 3. api: only the web pods (nginx proxies /api) may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shiplog.componentName" $api }}
  labels:
    {{- include "shiplog.labels" $api | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shiplog.selectorLabels" $api | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shiplog.selectorLabels" $web | nindent 14 }}
      ports:
        - port: 8080
{{- if .Values.postgres.enabled }}
---
# 4. postgres: only API pods (including their migration init container) may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "shiplog.labels" (dict "root" $ "component" "database") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shiplog.selectorLabels" $api | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
{{- if .Values.devDashboard.enabled }}
---
# 5. dev dashboard: UI open to anyone (dev only); OTLP only from the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shiplog.componentName" (dict "root" $ "component" "dashboard") }}
  labels:
    {{- include "shiplog.labels" (dict "root" $ "component" "dashboard") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shiplog.selectorLabels" (dict "root" $ "component" "dashboard") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 18888
    - from:
        - podSelector:
            matchLabels:
              {{- include "shiplog.selectorLabels" $api | nindent 14 }}
      ports:
        - port: 18889
{{- end }}
{{- end }}
