{{- /*
Password handling:
  1. an explicit auth.password wins;
  2. otherwise reuse the password from the existing Secret (via `lookup`), so upgrades don't change it;
  3. otherwise generate a random one.
Alphanumeric only, so it is safe to embed in a connection string.
Note: `lookup` returns nothing during `helm template` / --dry-run, so those show a fresh random value.
*/ -}}
{{- $name := include "postgres.fullname" . -}}
{{- $password := .Values.auth.password -}}
{{- if not $password -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if and $existing $existing.data (hasKey $existing.data "password") -}}
    {{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret on `helm uninstall`. StatefulSet volumes also survive an uninstall,
    # and a reinstall with a new password would no longer match the existing database.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
